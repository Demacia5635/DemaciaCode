name: sync acceleration limiter issue

on:
  push:
    branches: [kinematics-acceleration-limit-testing]
    paths:
      - src/main/java/frc/demacia/kinematics/KinematicsConstants.java
      - src/main/java/frc/demacia/kinematics/SwerveAccelerationLimiter.java
      - .github/scripts/sync_accel_limit_issue.py
      - .github/workflows/sync-accel-limit-issue.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/sync_accel_limit_issue.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
